name: TrueRank Math Engine Tests

# This tells GitHub to run the script every time you push to the main branch
on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-math-engine:
    runs-on: ubuntu-latest

    # Tells the server to run all commands from inside your backend folder
    defaults:
      run:
        working-directory: ./backendpy

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10" # You can adjust this to match your version

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: 🧪 Run Pytest Suite
        run: |
          python -m pytest -v